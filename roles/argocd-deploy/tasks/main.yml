---
- name: Add ArgoCD Helm repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm

- name: Ensure argocd namespace exists
  kubernetes.core.k8s:
    name: "{{ argocd_namespace }}"
    kind: Namespace
    api_version: v1
    state: present

- name: Install ArgoCD
  kubernetes.core.helm:
    name: "{{ argocd_release_name }}"
    chart_ref: argo/argo-cd
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: true
    values: "{{ argocd_helm_values | default({}) }}"
    chart_version: "{{ argocd_chart_version }}"
    state: present
    disable_hook: true

- name: Wait for ArgoCD server to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ argocd_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=argocd-server
  register: argocd_pods
  until: argocd_pods.resources | length > 0 and argocd_pods.resources[0].status.phase == 'Running'
  retries: 30
  delay: 5

- name: Create ArgoCD AppProject
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: gitops
        namespace: "{{ argocd_namespace }}"
      spec:
        description: GitOps applications project
        sourceRepos:
          - '*'
        destinations:
          - namespace: '*'
            server: https://kubernetes.default.svc
        clusterResourceWhitelist:
          - group: '*'
            kind: '*'

- name: Create ArgoCD Application for GitOps
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: gitops-apps
        namespace: "{{ argocd_namespace }}"
      spec:
        project: gitops
        source:
          repoURL: https://github.com/DurianLAB/ansible.git
          targetRevision: main
          path: gitops
        destination:
          server: https://kubernetes.default.svc
          namespace: default
        syncPolicy:
          automated:
            prune: true
            selfHeal: true

- name: Get ArgoCD server service info
  kubernetes.core.k8s_info:
    kind: Service
    name: argocd-server
    namespace: "{{ argocd_namespace }}"
  register: argocd_service

- name: Display deployment info
  ansible.builtin.debug:
    msg:
      - "ArgoCD installed in namespace: {{ argocd_namespace }}"
      - "ArgoCD URL: https://192.168.4.238:30080"
      - "ArgoCD Application 'gitops-apps' created to sync from DurianLAB/ansible/gitops"
